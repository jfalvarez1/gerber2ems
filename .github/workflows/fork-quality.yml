name: Fork output-safety checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test output retention without native solver dependencies
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
